version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: worldcup-tracker-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tracker_database}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
