version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: worldcup-tracker-db
    environment:
      MYSQL_DATABASE: tracker_database
      MYSQL_USER: User2025ensitech?
      MYSQL_PASSWORD: User2025ensitech?
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
