spring.application.name=tracker

# Database Configuration - loaded from .env file
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.security.user.name=admin
spring.security.user.password=admin

# Email Configuration - loaded from .env file
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Live Score API Configuration - loaded from .env file
livescore.api.key=${LIVESCORE_API_KEY}
livescore.api.secret=${LIVESCORE_API_SECRET}
livescore.api.base-url=${LIVESCORE_API_BASE_URL:https://livescore-api.com/api-client}
livescore.api.cache-duration-minutes=5