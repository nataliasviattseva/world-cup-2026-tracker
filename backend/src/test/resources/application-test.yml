
# World Cup 2026 Tracker - Test Configuration
spring:
  application:
    name: world-cup-2026-tracker-test
    
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tracker_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: create   # Create schema without dropping (fresh DB per CI run)
    show-sql: true            # Show SQL queries during tests
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.MySQL8Dialect
        
  test:
    database:
      replace: none # Keep our configured datasource for tests
      
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      
  # Disable email for tests
#   mail:
#   # host: localhost
#   # port: 25
#     username: 
#     password: 
#     properties:
#       mail:
#         smtp:
#           auth: false
#           starttls:
#             enable: false

# # Test server configuration
# server:
#   port: 0  # Use random available port for parallel test execution

# Enhanced logging for World Cup tracker testing
logging:
  level:
    '[com.worldcup.tracker]': DEBUG
    '[org.springframework.test]': INFO
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.type.descriptor.sql.BasicBinder]': TRACE
    '[org.springframework.web]': INFO
