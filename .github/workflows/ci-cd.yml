name: CI/CD - World Cup 2026 Tracker

# ============================================================================
# WORKFLOW TRIGGERS
# ============================================================================
on:
  push:
    branches: [ main, test, dev ]
  pull_request:
    branches: [ main, test, dev ]
  workflow_dispatch:

# ============================================================================
# PERMISSIONS
# ============================================================================
permissions:
  contents: write
  security-events: write
  checks: write
  pull-requests: write

# ============================================================================
# JOBS
# ============================================================================
jobs:
  # ==========================================================================
  # JOB 1: BACKEND TESTS
  # ==========================================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tracker_database
          MYSQL_USER: ${{ secrets.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Wait for MySQL
      run: |
        timeout=120
        while ! mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; do
          echo "Waiting for MySQL..."
          sleep 2
          timeout=$((timeout-2))
          [ $timeout -le 0 ] && echo "MySQL timeout" && exit 1
        done
        echo  MySQL ready!"
        
    - name: Setup database
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -proot -e "
          CREATE DATABASE IF NOT EXISTS tracker_database;
          CREATE USER IF NOT EXISTS '\${{ secrets.DB_USERNAME }}'@'%' IDENTIFIED BY '\${{ secrets.DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON tracker_database.* TO '\${{ secrets.DB_USERNAME }}'@'%';
          FLUSH PRIVILEGES;
        "
        
    - name: Validate Maven wrapper
      run: chmod +x mvnw
      working-directory: backend
      
    - name: Run tests
      run: ./mvnw test --batch-mode --no-transfer-progress
      working-directory: backend
      env:
        DB_URL: jdbc:mysql://localhost:3306/tracker_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: backend/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true

  # ==========================================================================
  # JOB 2: BUILD APPLICATION
  # ==========================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Build JAR
      run: ./mvnw clean package -DskipTests --batch-mode --no-transfer-progress
      working-directory: backend
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-jar-${{ github.sha }}
        path: |
          backend/target/*.jar
          !backend/target/*-sources.jar
          !backend/target/*-javadoc.jar
        retention-days: 30

  # ==========================================================================
  # JOB 3: SECURITY - OWASP BACKEND
  # ==========================================================================
  security-backend:
    name: OWASP Backend Scan
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Run OWASP Check
      run: ./mvnw dependency-check:check --batch-mode --no-transfer-progress
      working-directory: backend
      continue-on-error: true
      
    - name: Upload OWASP Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: owasp-backend-${{ github.sha }}
        path: backend/target/dependency-check-report.*
        retention-days: 30
        if-no-files-found: warn

  # ==========================================================================
  # JOB 4: SECURITY - NPM AUDIT FRONTEND
  # ==========================================================================
  security-frontend:
    name: npm Audit Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
      
    - name: Run npm audit
      run: npm audit --json > npm-audit.json || true
      working-directory: frontend
      continue-on-error: true
      
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-${{ github.sha }}
        path: frontend/npm-audit.json
        retention-days: 30
        if-no-files-found: warn

  # ==========================================================================
  # JOB 5: SECURITY - TRIVY SCANNER
  # ==========================================================================
  security-trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: ./backend
        format: sarif
        output: trivy-results.sarif
        
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: trivy-results.sarif

  # ==========================================================================
  # JOB 6: DEPLOY TO PRODUCTION
  # ==========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security-backend, security-frontend, security-trivy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        
    - name: Build production JAR
      run: ./mvnw clean package -DskipTests --batch-mode --no-transfer-progress
      working-directory: backend
      
    - name: Create Dockerfile
      run: |
        cat > Dockerfile << 'EOF'
        FROM openjdk:17-jdk-slim
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY backend/target/*.jar app.jar
        RUN addgroup --system spring && adduser --system --group spring
        RUN chown -R spring:spring /app
        USER spring:spring
        EXPOSE 8080
        HEALTHCHECK --interval=30s --timeout=3s --start-period=60s --retries=3 CMD pgrep java || exit 1
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
        EOF
        
    - name: Build Docker image
      run: |
        docker build -t world-cup-tracker:${{ github.sha }} .
        docker tag world-cup-tracker:${{ github.sha }} world-cup-tracker:latest
        
    - name: Save Docker image
      run: docker save world-cup-tracker:${{ github.sha }} | gzip > docker-image.tar.gz
        
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ github.sha }}
        path: docker-image.tar.gz
        retention-days: 7
        
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## World Cup 2026 Tracker v${{ github.run_number }}
          
          **Commit:** ${{ github.sha }}
          **Docker:** world-cup-tracker:${{ github.sha }}
        draft: false
        prerelease: false
