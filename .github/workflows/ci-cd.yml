name: CI/CD - World Cup 2026 Tracker

# ============================================================================
# WORKFLOW TRIGGERS
# ============================================================================
on:
  push:
    branches: [ main, test, dev ]
  pull_request:
    branches: [ main, test, dev ]
  workflow_dispatch:

# ============================================================================
# PERMISSIONS
# ============================================================================
permissions:
  contents: write
  security-events: write
  checks: write
  pull-requests: write

# ============================================================================
# JOBS
# ============================================================================
jobs:
  # ==========================================================================
  # JOB 1: BACKEND TESTS
  # ==========================================================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tracker_database
          MYSQL_USER: ${{ secrets.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Wait for MySQL
      run: |
        timeout=120
        while ! mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; do
          echo "Waiting for MySQL..."
          sleep 2
          timeout=$((timeout-2))
          [ $timeout -le 0 ] && echo "MySQL timeout" && exit 1
        done
        echo "MySQL ready!"
        
    - name: Setup database
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -proot -e "
          CREATE DATABASE IF NOT EXISTS tracker_database;
          CREATE USER IF NOT EXISTS '${{ secrets.DB_USERNAME }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON tracker_database.* TO '${{ secrets.DB_USERNAME }}'@'%';
          FLUSH PRIVILEGES;
        "
        
    - name: Validate Maven wrapper
      run: chmod +x mvnw
      working-directory: backend
      
    - name: Run tests
      run: ./mvnw test --batch-mode --no-transfer-progress -Dspring.jpa.hibernate.ddl-auto=create
      working-directory: backend
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/tracker_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        SPRING_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        SPRING_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SPRING_JPA_SHOW_SQL: true
        
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: backend/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true

  # ==========================================================================
  # JOB 2: BUILD APPLICATION
  # ==========================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Ensure Maven wrapper is executable
      run: chmod +x mvnw
      working-directory: backend
        
    - name: Build JAR
      run: ./mvnw clean package -DskipTests --batch-mode --no-transfer-progress
      working-directory: backend
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-jar-${{ github.sha }}
        path: |
          backend/target/*.jar
          !backend/target/*-sources.jar
          !backend/target/*-javadoc.jar
        retention-days: 30

  # ==========================================================================
  # JOB 3: CODE QUALITY - SONARCLOUD
  # ==========================================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Ensure Maven wrapper is executable
      run: chmod +x mvnw
      working-directory: backend
        
    - name: Build and analyze with SonarCloud
      run: ./mvnw clean verify sonar:sonar -Dsonar.projectKey=world-cup-2026-tracker -Dsonar.organization=nataliasviattseva -Dsonar.host.url=https://sonarcloud.io --batch-mode --no-transfer-progress
      working-directory: backend
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================================================
  # JOB 4: SECURITY - OWASP BACKEND
  # ==========================================================================
  security-backend:
    name: OWASP Backend Scan
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
        
    - name: Ensure Maven wrapper is executable
      run: chmod +x mvnw
      working-directory: backend
        
    - name: Run OWASP Check
      run: ./mvnw dependency-check:check --batch-mode --no-transfer-progress
      working-directory: backend
      continue-on-error: true
      
    - name: Upload OWASP Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: owasp-backend-${{ github.sha }}
        path: backend/target/dependency-check-report.*
        retention-days: 30
        if-no-files-found: warn

  # ==========================================================================
  # JOB 5: SECURITY - NPM AUDIT FRONTEND
  # ==========================================================================
  security-frontend:
    name: npm Audit Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
      
    - name: Run npm audit (keep report)
      run: npm audit --json > npm-audit.json
      working-directory: frontend
      continue-on-error: true
      
    - name: Fail on high/critical vulnerabilities
      run: npm audit --audit-level=high
      working-directory: frontend
      
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-${{ github.sha }}
        path: frontend/npm-audit.json
        retention-days: 30
        if-no-files-found: warn

  # ==========================================================================
  # JOB 6: SECURITY - DEPENDENCY REVIEW (PR GATE)
  # ==========================================================================
  dependency-review:
    name: Dependency Review (PR Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        deny-licenses: GPL-3.0, AGPL-3.0
        comment-summary-in-pr: always

  # ==========================================================================
  # JOB 7: SECURITY - TRIVY BACKEND SCANNER
  # ==========================================================================
  security-trivy-backend:
    name: Trivy Backend Scan
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: ./backend
        format: sarif
        output: trivy-backend.sarif
        
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: trivy-backend.sarif

  # ==========================================================================
  # JOB 8: SECURITY - TRIVY FRONTEND SCANNER
  # ==========================================================================
  security-trivy-frontend:
    name: Trivy Frontend Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: ./frontend
        format: sarif
        output: trivy-frontend.sarif
        
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: trivy-frontend.sarif

  # ==========================================================================
  # JOB 9: SECURITY - CODEQL FRONTEND SAST
  # ==========================================================================
  security-codeql:
    name: CodeQL Frontend SAST
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript-typescript
        queries: security-and-quality
        
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:javascript-typescript"

  # ==========================================================================
  # JOB 10: SECURITY - SECRETS SCAN
  # ==========================================================================
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # JOB 11: DEPLOY TO PRODUCTION
  # ==========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, sonarcloud, security-backend, security-frontend, security-trivy-backend, security-trivy-frontend, security-codeql, secrets-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        
    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        
    - name: Ensure Maven wrapper is executable
      run: chmod +x mvnw
      working-directory: backend
        
    - name: Build production JAR
      run: ./mvnw clean package -DskipTests --batch-mode --no-transfer-progress
      working-directory: backend
      
    - name: Create Dockerfile
      run: |
        cat > Dockerfile << 'EOF'
        FROM openjdk:17-jdk-slim
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY backend/target/*.jar app.jar
        RUN addgroup --system spring && adduser --system --group spring
        RUN chown -R spring:spring /app
        USER spring:spring
        EXPOSE 8080
        HEALTHCHECK --interval=30s --timeout=3s --start-period=60s --retries=3 CMD pgrep java || exit 1
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
        EOF
        
    - name: Build Docker image
      run: |
        docker build -t world-cup-tracker:${{ github.sha }} .
        docker tag world-cup-tracker:${{ github.sha }} world-cup-tracker:latest
        
    - name: Save Docker image
      run: docker save world-cup-tracker:${{ github.sha }} | gzip > docker-image.tar.gz
        
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ github.sha }}
        path: docker-image.tar.gz
        retention-days: 7
        
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## World Cup 2026 Tracker v${{ github.run_number }}
          
          **Commit:** ${{ github.sha }}
          **Docker:** world-cup-tracker:${{ github.sha }}
        draft: false
        prerelease: false
