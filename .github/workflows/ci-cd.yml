name: CI/CD - World Cup 2026 Tracker

on:
  push:
    branches: [ main, dev, test, feature/* ]
  pull_request:
    branches: [ main, test, dev ]
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write
  security-events: write

defaults:
  run:
    working-directory: ./backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tracker_database
          MYSQL_USER: User2025ensitech?
          MYSQL_PASSWORD: User2025ensitech?
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-
          
    - name: Wait for MySQL to be ready
      run: |
        timeout=60
        while ! mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent; do
          echo "Waiting for MySQL to start..."
          sleep 2
          timeout=$((timeout-2))
          if [ $timeout -le 0 ]; then
            echo "MySQL failed to start within 60 seconds"
            exit 1
          fi
        done
        echo "MySQL is ready!"
        
    - name: Setup database schema
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -proot -e "
          CREATE DATABASE IF NOT EXISTS tracker_database;
          CREATE USER IF NOT EXISTS 'User2025ensitech?'@'%' IDENTIFIED BY 'User2025ensitech?';
          GRANT ALL PRIVILEGES ON tracker_database.* TO 'User2025ensitech?'@'%';
          FLUSH PRIVILEGES;
        "
        
    - name: Validate Maven wrapper
      run: chmod +x ../mvnw
      
    - name: Run tests
      run: ../mvnw test --batch-mode --no-transfer-progress
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/tracker_database?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: User2025ensitech?
        SPRING_DATASOURCE_PASSWORD: User2025ensitech?
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SPRING_JPA_SHOW_SQL: true
        
    - name: Validate test results
      run: |
        if [ -f target/surefire-reports/TEST-*.xml ]; then
          echo "Test reports generated successfully"
          TEST_COUNT=$(find target/surefire-reports -name "TEST-*.xml" | wc -l)
          echo "Found $TEST_COUNT test report files"
        else
          echo "No test reports found - tests may not have run properly"
        fi
        
    - name: Build application
      run: ../mvnw clean package -DskipTests --batch-mode --no-transfer-progress
      
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: backend/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
        
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: world-cup-tracker-${{ github.sha }}
        path: |
          target/*.jar
          !target/*-sources.jar
          !target/*-javadoc.jar
        retention-days: 30

    # Security scan
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './backend'
        format: 'sarif'
        output: 'backend/trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'backend/trivy-results.sarif'

  # Deploy job (only runs on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        
    - name: Build production JAR
      run: ../mvnw clean package -DskipTests --batch-mode --no-transfer-progress
      
    - name: Validate JAR was created
      run: |
        shopt -s nullglob
        files=(target/*.jar)
        if (( ${#files[@]} == 0 )); then
            echo "JAR file not found in target directory"
            ls -la target/
            exit 1
        fi
        echo "JAR file found:"
        ls -la target/*.jar
      
    - name: Create production Dockerfile
      run: |
        cat > Dockerfile << 'EOF'
        FROM openjdk:17-jdk-slim
        
        # Install curl for health checks (if actuator is added later)
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /app
        COPY target/*.jar app.jar
        
        # Create non-root user
        RUN addgroup --system spring && adduser --system --group spring
        RUN chown -R spring:spring /app
        USER spring:spring
        
        EXPOSE 8080
        
        # Basic health check - check if process is running
        HEALTHCHECK --interval=30s --timeout=3s --start-period=60s --retries=3 \
          CMD pgrep java || exit 1
        
        ENTRYPOINT ["java", "-jar", "/app/app.jar"]
        EOF
        
    - name: Build Docker image
      run: |
        docker build -t world-cup-tracker:${{ github.sha }} .
        docker tag world-cup-tracker:${{ github.sha }} world-cup-tracker:latest
        
    - name: Save Docker image as artifact
      run: |
        docker save world-cup-tracker:${{ github.sha }} | gzip > world-cup-tracker-${{ github.sha }}.tar.gz
        
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ github.sha }}
        path: world-cup-tracker-${{ github.sha }}.tar.gz
        retention-days: 7
        
    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: World Cup Tracker v${{ github.run_number }}
        body: |
          ## World Cup 2026 Tracker Release v${{ github.run_number }}
          
          ### Changes
          - Deployment from commit ${{ github.sha }}
          - Backend Spring Boot application
          
          ### Artifacts
          - JAR: Available in build artifacts
          - Docker: world-cup-tracker:${{ github.sha }}
          
          ### Deployment
          Automatically deployed from main branch.
        draft: false
        prerelease: false